version: '3.8'

services:
  db:
    image: postgres:15
    container_name: postgres-db
    restart: always
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrations:
    image: flyway/flyway:11.7.1
    command: -url=jdbc:postgresql://db:5432/${DB_DATABASE} -user=${DB_USERNAME} -password=${DB_PASSWORD} migrate
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./migrations/db:/flyway/sql
    env_file:
      - .env
